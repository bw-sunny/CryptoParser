syntax = "proto3";

option go_package = "/Users/bezenov_v/Desktop/CryptoParser/proto";

service Crypto {
  rpc CryptoPrice (PriceRequest) returns (PriceResponse) {}
  rpc CryptoRatio (RatioRequest) returns (RatioResponse) {}
}

message PriceRequest {
  string name = 1;
}

message PriceResponse {
  string message = 1;
}

message RatioRequest {
  string name = 1;
}

message RatioResponse {
  string message = 1;
  string buy_ratio = 2;
  string sell_ratio = 3;
  string long_short_ratio = 4;
}